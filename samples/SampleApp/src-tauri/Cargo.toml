[package]
name = "sample-app"
version = "0.1.0"
description = "Sample app for tauri-plugin-dotnet"
authors = ["George Samartzidis"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sample_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-dotnet = { path = "../../.." }
tauri-plugin-log = "2"
log = "0.4"

[features]
# Embeds the frontend in the binary. `tauri dev` / `tauri build` enable it; a plain `cargo build` needs it explicitly.
custom-protocol = ["tauri/custom-protocol"]
# Embeds the .NET backend in the executable instead of loading it from files. Build the backend first with
# `dotnet build src-dotnet/SampleApp.Backend -p:TauriDotNetEmbed=true` (add `-c Release` for a release build), which
# writes SampleApp.Backend.tdnbundle into the build output folder that src/lib.rs includes.
embedded-backend = []
# Loads the backend in-process from files even in a debug build (src-dotnet/SampleApp.Backend/bin/Debug), instead of
# the dev-only sidecar under `dotnet watch`. Ignored when `embedded-backend` is on.
path-backend = []
