name: Build, Test & Publish

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0). Leave empty to only build, test and pack.'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Test: builds (as a side effect) and runs .NET (library + generator) and
  # Rust unit tests. No separate "build" job: GitHub Actions jobs run on
  # isolated VMs, so a prior build job's output wouldn't be reused here anyway.
  # ---------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    name: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet test
        run: dotnet test dotnet/Tauri.Plugin.DotNet.slnx -c Release --verbosity normal

      - name: cargo test
        run: cargo test

  # ---------------------------------------------------------------------------
  # Pack: build the nupkg and the crate package
  # ---------------------------------------------------------------------------
  pack:
    needs: test
    runs-on: windows-latest
    name: Pack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches package/crate version
        if: github.event.inputs.tag_name != ''
        shell: bash
        run: |
          TAG_VERSION="${{ github.event.inputs.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' dotnet/src/Tauri.Plugin.DotNet/Tauri.Plugin.DotNet.csproj)
          CRATE_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match <Version>$CSPROJ_VERSION</Version> in Tauri.Plugin.DotNet.csproj"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi

      - name: Pack nupkg
        run: dotnet pack dotnet/src/Tauri.Plugin.DotNet/Tauri.Plugin.DotNet.csproj -c Release -o artifacts

      - name: Package crate
        # --no-verify: the verify rebuild flags build.rs writing to permissions/autogenerated
        # outside OUT_DIR; skipping it still produces the same .crate (see techContext.md).
        run: cargo package --no-verify

      - name: Copy .crate into artifacts
        shell: bash
        run: cp target/package/*.crate artifacts/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.crate
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: create the GitHub Release, then push to nuget.org and crates.io
  # via Trusted Publishing (OIDC) - only when tag_name is set. Gated behind
  # the "publish" environment - configure required reviewers on it under repo
  # Settings > Environments so this job pauses for human approval before
  # anything is pushed. The packed artifacts are already inspectable from the
  # "pack" job's upload, so the reviewer can check them before approving.
  # ---------------------------------------------------------------------------
  publish:
    needs: pack
    if: github.event.inputs.tag_name != ''
    runs-on: ubuntu-latest
    name: Publish
    environment: publish
    permissions:
      contents: write   # to create the GitHub Release
      id-token: write   # required for both NuGet and crates.io Trusted Publishing (OIDC)

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          files: dist/*
          generate_release_notes: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: samartzidis

      - name: Push to nuget.org
        run: dotnet nuget push dist/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (OIDC -> temporary token)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
