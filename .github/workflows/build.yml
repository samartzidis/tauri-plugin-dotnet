name: Build, Test & Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also create a GitHub Release and publish to nuget.org/crates.io, using the version already in the csproj/Cargo.toml. Leave unchecked to only build, test and pack.'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Test: builds (as a side effect) and runs .NET (library + generator) and
  # Rust unit tests. No separate "build" job: GitHub Actions jobs run on
  # isolated VMs, so a prior build job's output wouldn't be reused here anyway.
  # ---------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    name: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: dotnet test
        run: dotnet test dotnet/Tauri.Plugin.DotNet.slnx -c Release --verbosity normal

      - name: cargo test
        run: cargo test

  # ---------------------------------------------------------------------------
  # Pack: build the nupkg and the crate package. The csproj and Cargo.toml
  # versions are the single source of truth - no tag or version is typed in
  # by hand; the release tag (when publishing) is derived from them.
  # ---------------------------------------------------------------------------
  pack:
    needs: test
    runs-on: windows-latest
    name: Pack

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' dotnet/src/Tauri.Plugin.DotNet/Tauri.Plugin.DotNet.csproj)
          CRATE_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "$CSPROJ_VERSION" != "$CRATE_VERSION" ]; then
            echo "csproj <Version>$CSPROJ_VERSION</Version> does not match Cargo.toml version \"$CRATE_VERSION\""
            exit 1
          fi
          echo "version=$CSPROJ_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack nupkg
        run: dotnet pack dotnet/src/Tauri.Plugin.DotNet/Tauri.Plugin.DotNet.csproj -c Release -o artifacts

      - name: Package crate
        # --no-verify: the verify rebuild flags build.rs writing to permissions/autogenerated
        # outside OUT_DIR; skipping it still produces the same .crate (see techContext.md).
        run: cargo package --no-verify

      - name: Copy .crate into artifacts
        shell: bash
        run: cp target/package/*.crate artifacts/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.crate
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: create the GitHub Release (tag derived from the version above,
  # created automatically since it doesn't exist yet), then push to nuget.org
  # and crates.io via Trusted Publishing (OIDC) - only when the "publish"
  # input is checked. Gated behind the "publish" environment - configure
  # required reviewers on it under repo Settings > Environments so this job
  # pauses for human approval before anything is pushed. The packed artifacts
  # are already inspectable from the "pack" job's upload, so the reviewer can
  # check them before approving.
  # ---------------------------------------------------------------------------
  publish:
    needs: pack
    if: inputs.publish
    runs-on: ubuntu-latest
    name: Publish
    environment: publish
    permissions:
      contents: write   # to create the GitHub Release
      id-token: write   # required for both NuGet and crates.io Trusted Publishing (OIDC)

    env:
      TAG: v${{ needs.pack.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: samartzidis

      - name: Push to nuget.org
        run: dotnet nuget push dist/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (OIDC -> temporary token)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
